<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc" id="pipeline-root">
      <title id="pipeline-title">From a JSON script to a rendered MP4</title>
      <desc id="pipeline-desc">A voiceover script feeds local text-to-speech and a procedural score generator; their WAV files land in public/, are mixed by the Remotion compositions and rendered to MP4.</desc>
      <defs>
      <style>#pipeline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520; }
      #pipeline-root { font-family: ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; color: var(--color-ink); }
      #pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #pipeline-root .name { font-family: ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #2d3142; }
      #pipeline-root .sub { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 10.5px; fill: #5a6580; }
      #pipeline-root .tag { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 8.5px; font-weight: 600; letter-spacing: 0.08em; fill: #4f5d75; }
      #pipeline-root .lbl { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 9.5px; font-weight: 500; letter-spacing: 0.06em; fill: #4f5d75; }
      #pipeline-root .lbl-accent { fill: #bf4520; }
      #pipeline-root .eyebrow-svg { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 10px; letter-spacing: 0.18em; fill: #4f5d75; }
      #pipeline-root .title-svg { font-family: Georgia, 'Times New Roman', serif; font-size: 24px; fill: #2d3142; }
      #pipeline-root .legend { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 10px; fill: #4f5d75; }</style>
        <marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <pattern id="pipeline-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/></pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#pipeline-dots)" opacity="0.55"/>

      <text class="eyebrow-svg" x="40" y="40">PIPELINE · ONE SCRIPT, ONE COMMAND</text>
      <text class="title-svg" x="40" y="72">From a JSON script to a rendered MP4</text>

      <g transform="translate(0,48)">
      <!-- ARROWS (drawn before nodes) -->
      <!-- script → voiceover.mjs -->
      <path d="M208 236 H232 Q240 236 240 228 V216 Q240 208 248 208 H270" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
      <!-- script → score.mjs -->
      <path d="M208 260 H232 Q240 260 240 268 V312 Q240 320 248 320 H270" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
      <!-- tts-setup → voiceover.mjs -->
      <line x1="360" y1="140" x2="360" y2="174" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pipeline-arrow)"/>
      <rect x="370" y="150" width="88" height="14" fill="#f5f5f5"/>
      <text class="lbl" x="376" y="160">ONNX VOICES</text>
      <!-- voiceover.mjs → public -->
      <path d="M448 208 H476 Q484 208 484 216 V228 Q484 236 492 236 H510" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
      <!-- score.mjs → public -->
      <path d="M448 320 H476 Q484 320 484 312 V268 Q484 260 492 260 H510" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
      <!-- public → compositions -->
      <line x1="680" y1="248" x2="742" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#pipeline-arrow)"/>
      <!-- compositions → studio (preview) -->
      <line x1="836" y1="208" x2="836" y2="142" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pipeline-arrow)"/>
      <rect x="846" y="168" width="84" height="14" fill="#f5f5f5"/>
      <text class="lbl" x="852" y="178">NPM RUN DEV</text>
      <!-- compositions → mp4 (headline path) -->
      <line x1="836" y1="288" x2="836" y2="354" stroke="#bf4520" stroke-width="1.6" marker-end="url(#pipeline-arrow-accent)"/>
      <rect x="846" y="314" width="112" height="14" fill="#f5f5f5"/>
      <text class="lbl lbl-accent" x="852" y="324">REMOTION RENDER</text>

      <!-- NODES -->
      <!-- script (input) -->
      <rect x="40" y="208" width="168" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="208" width="168" height="80" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.04"/>
      <rect x="52" y="220" width="40" height="14" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30"/>
      <text class="tag" x="57" y="230">INPUT</text>
      <text class="name" x="52" y="256">Script</text>
      <text class="sub" x="52" y="274">voiceover/&lt;name&gt;.json</text>

      <!-- tts-setup -->
      <rect x="272" y="72" width="176" height="68" rx="6" fill="#f5f5f5"/>
      <rect x="272" y="72" width="176" height="68" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="284" y="84" width="48" height="14" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30"/>
      <text class="tag" x="289" y="94">ONCE</text>
      <text class="name" x="284" y="116">npm run tts:setup</text>
      <text class="sub" x="284" y="131">Piper pt-BR → .tts-models</text>

      <!-- voiceover.mjs -->
      <rect x="272" y="176" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="272" y="176" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="284" y="202">Neural voiceover</text>
      <text class="sub" x="284" y="220">npm run voice -- &lt;name&gt;</text>
      <text class="sub" x="284" y="233">sherpa-onnx · offline</text>

      <!-- score.mjs -->
      <rect x="272" y="288" width="176" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="272" y="288" width="176" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="284" y="314">Procedural score</text>
      <text class="sub" x="284" y="332">npm run score -- &lt;name&gt;</text>
      <text class="sub" x="284" y="345">synced to cuts · seeded</text>

      <!-- public/ (store) -->
      <rect x="512" y="200" width="168" height="104" rx="6" fill="#f5f5f5"/>
      <rect x="512" y="200" width="168" height="104" rx="6" fill="#ececec" stroke="#2d3142" stroke-width="1"/>
      <rect x="524" y="212" width="48" height="14" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30"/>
      <text class="tag" x="528" y="222">ASSETS</text>
      <text class="name" x="524" y="248">public/</text>
      <text class="sub" x="524" y="266">voiceover/&lt;name&gt;/*.wav</text>
      <text class="sub" x="524" y="280">+ manifest.json</text>
      <text class="sub" x="524" y="296">music/&lt;name&gt;.wav</text>

      <!-- compositions (focal) -->
      <rect x="744" y="208" width="184" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="208" width="184" height="80" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.4" fill-opacity="0.08"/>
      <rect x="756" y="220" width="44" height="14" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.55"/>
      <text class="tag" x="761" y="230" fill="#bf4520" style="fill:#bf4520">REACT</text>
      <text class="name" x="756" y="256">Compositions</text>
      <text class="sub" x="756" y="274">scenes + voice ducking</text>

      <!-- studio (optional) -->
      <rect x="744" y="80" width="184" height="60" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="80" width="184" height="60" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text class="name" x="756" y="106">Remotion Studio</text>
      <text class="sub" x="756" y="124">live preview · localhost:3000</text>

      <!-- mp4 (output) -->
      <rect x="744" y="356" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="356" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text class="name" x="756" y="384">out/*.mp4</text>
      <text class="sub" x="756" y="404">9:16 · 4:5 · 1:1 · 16:9</text>

      </g>
      <g transform="translate(0,40)">
      <!-- LEGEND (bottom strip) -->
      <line x1="40" y1="468" x2="960" y2="468" stroke="#2d3142" stroke-opacity="0.12"/>
      <rect x="40" y="488" width="20" height="14" rx="3" fill="#ffffff" stroke="#2d3142"/>
      <text class="legend" x="68" y="499">Node script</text>
      <rect x="168" y="488" width="20" height="14" rx="3" fill="#ececec" stroke="#2d3142"/>
      <text class="legend" x="196" y="499">Static assets</text>
      <rect x="308" y="488" width="20" height="14" rx="3" fill="#bf4520" stroke="#bf4520" fill-opacity="0.08"/>
      <text class="legend" x="336" y="499">Focal · render path</text>
      <line x1="480" y1="495" x2="508" y2="495" stroke="#4f5d75" stroke-dasharray="5,4"/>
      <text class="legend" x="516" y="499">One-time / optional</text>
      </g>
    </svg>
